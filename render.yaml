# Render blueprint for Custodia API (FastAPI backend).
# Note: Render free tier services sleep after 15 minutes of inactivity and spin down.
# Free instances use ephemeral storage; configure DATABASE_URL (Neon PostgreSQL) for persistent reviews.
services:
  - type: web
    name: custodia-api
    runtime: docker
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Optional: Google AI Studio key for Gemini 2.5 advisory extraction & Fact Check
      - key: ANTHROPIC_API_KEY
        sync: false        # Optional legacy Anthropic key: leave unset to run on deterministic heuristic extractor
      - key: CUSTODIA_MODEL_EXTRACT
        value: claude-haiku-5-5
      - key: CUSTODIA_MODEL_FLAGS
        value: claude-haiku-5-5
      - key: CUSTODIA_MODEL_REWRITE
        value: claude-sonnet-5-5
      - key: CUSTODIA_LLM_DAILY_CALL_CAP
        value: "500"
      - key: CUSTODIA_RETENTION_DAYS
        value: "30"
      - key: CUSTODIA_SECRET
        generateValue: true # Generates secure random secret for signed cookies
      - key: CUSTODIA_ENV
        value: "prod"
      - key: CUSTODIA_FREE_CHECKS
        value: "1"
      - key: CUSTODIA_CORS_ORIGINS
        sync: false        # Set to your Vercel URL, e.g. https://<app>.vercel.app
      - key: DATABASE_URL
        sync: false        # Optional Neon Postgres connection string for persistent retention
      - key: CUSTODIA_NLI_ENABLED
        value: "0"         # Set to "1" to enable local quantized INT8 ONNX NLI inference (~230 MB peak RSS, within 512 MB limit)
      - key: CUSTODIA_NLI_MODEL_ID
        value: "cross-encoder/nli-MiniLM2-L6-H768" # Or "cross-encoder/nli-deberta-v3-xsmall" (45.8 MB pruned & INT8 quantized)
