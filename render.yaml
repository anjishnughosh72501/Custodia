# Render blueprint (one web service).
# Build: the Dockerfile compiles the React app (stage 1) and serves it from FastAPI (stage 2).
services:
  - type: web
    name: custodia-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # optional: leave unset to run on the rule-based extractor
      - key: CUSTODIA_MODEL
        value: claude-sonnet-5-5
      - key: CUSTODIA_NLI_ENABLED
        value: "0"         # set to "1" to enable local quantized NLI inference
