name: CI

on:
  push:
    branches: [ main, round3/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: |
          python -m pytest -q

      - name: Run benchmark suite
        run: |
          python bench/run.py

  frontend:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust Security Gateway CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --check

      - name: Rust Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust unit & integration tests
        run: cargo test --all

      - name: Build gateway in release mode
        run: cargo build --release

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: custodia:latest

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt playwright
          playwright install --with-deps chromium

      - name: Install Node dependencies & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Run Server and E2E Tests
        env:
          CUSTODIA_ENV: dev
          CUSTODIA_RATE_LIMIT_PER_MIN: "0"
        run: |
          python -m uvicorn app.main:app --port 8000 &
          sleep 3
          python tests/e2e/test_ui.py
