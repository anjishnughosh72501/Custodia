[package]
name = "custodia-secure-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Custodia Security Team"]
description = "Custodia Secure Document Gateway — memory-safe pre-parser validation, magic-byte inspection, and anti-decompression exhaustion controls."

[dependencies]
axum = { version = "0.7.5", default-features = false, features = ["tokio", "http1", "json", "multipart"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.4", features = ["limit", "timeout"] }
tower-http = { version = "0.5", features = ["trace"] }
indexmap = "=2.6.0"
hashbrown = "=0.14.5"

[dev-dependencies]
tempfile = "3.10"
